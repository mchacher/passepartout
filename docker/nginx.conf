# nginx server for the built Passepartout SPA (spec 022). Serves the static app with a
# single-page-app fallback, gzips text assets, caches the content-hashed build assets
# forever and never caches index.html, so a redeploy is picked up on the next refresh.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm font/woff2;

    # Content-hashed build output (Vite emits assets/<name>.<hash>.<ext>): safe to cache
    # forever; a new build changes the hash, so clients fetch the new file.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The HTML entry must never be cached, or a redeploy would keep serving the old bundle.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA routing: unknown paths serve the app shell (deep links / refresh work).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Server-backed data (spec 024): route the app's API calls to the `api` service. The SPA
    # and API share one origin, so the session cookie is first-party. If no `api` service is
    # running, the SPA's /api/health probe fails and it falls back to local mode. Raise the
    # body size for full-resolution photo uploads.
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64m;
    }
}

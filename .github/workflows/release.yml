name: Release

# On a version tag, build the Docker image and publish it to GHCR (spec 023), so a
# self-hosted instance updates with `docker compose pull && up -d`. Also creates a
# GitHub Release. Cut a release with scripts/release.sh (bumps package.json + tags).

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # create the GitHub Release
  packages: write # push the image to GHCR

jobs:
  # A release note for the tagged version MUST exist in docs/release-notes.md, or nothing is
  # published (spec 028). This gates the whole release, before any image is built.
  verify-notes:
    name: Verify release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require a release note for this tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -qE "^## v${VERSION}([[:space:]]|$)" docs/release-notes.md; then
            echo "::error::No release note for v${VERSION} in docs/release-notes.md. Add a '## v${VERSION}' section before tagging."
            exit 1
          fi
          echo "Found the release note for v${VERSION}."

  publish:
    name: Build and publish the Docker image
    needs: verify-notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push (web)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Derive server image tags and labels
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-server
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push (server)
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

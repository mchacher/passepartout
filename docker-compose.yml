# Self-hosting Passepartout. `docker compose up -d --build` builds the app + the API and
# serves everything on http://<host>:8080. Put your reverse proxy (Caddy/Traefik/nginx, as
# for Sowel) in front to terminate TLS and forward to port 80.
#
# Server mode (spec 024): with the `api` service running, albums live on the server behind a
# single password (set PASSEPARTOUT_PASSWORD + SESSION_SECRET). If you remove the `api`
# service, the app falls back to local-first mode (data in each browser) - nginx's /api probe
# just fails and the SPA uses IndexedDB.

services:
  web:
    # Local build (default). For registry-based updates (spec 023), comment out `build` and
    # use the published image instead, then update with `docker compose pull && up -d`:
    #   image: ghcr.io/mchacher/passepartout:latest   # or pin a version, e.g. :0.1.0
    build: .
    image: passepartout:local
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      - api

  api:
    # For registry-based updates: image: ghcr.io/mchacher/passepartout-server:latest
    build: ./server
    image: passepartout-server:local
    restart: unless-stopped
    environment:
      # CHANGE THESE. The password opens the album server; the secret signs the session
      # cookie (set a stable one so sessions survive a restart).
      - PASSEPARTOUT_PASSWORD=${PASSEPARTOUT_PASSWORD:-change-me}
      - SESSION_SECRET=${SESSION_SECRET:-change-me-too}
      # Optional: a GitHub token (read access) so the app can see the latest release of the
      # private repo and show "update available" (spec 025). Detection is skipped without it.
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    volumes:
      - passepartout-data:/data # SQLite doc store + image blobs
      # OPT-IN one-click update (spec 025). Uncommenting this mounts the Docker socket, which
      # gives this container effective control over the host Docker daemon: a successful RCE
      # against the app would escalate to ROOT on the host. Leave it commented to update
      # manually (`docker compose pull && docker compose up -d`) - the in-app "Update now"
      # button is then disabled and the manual command shown instead.
      # - /var/run/docker.sock:/var/run/docker.sock

volumes:
  passepartout-data:
